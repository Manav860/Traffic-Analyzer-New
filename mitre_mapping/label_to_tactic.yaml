# Version: 1.0.0
# Reference: MITRE ATT&CK Enterprise Matrix (STIX 2.1)
# Note: Raw datasets (CIC-IDS-2018, CTU-13) provide categorical attack names (e.g. PortScan, DoS Hulk, Bot).
# This YAML maps raw dataset labels to standard MITRE ATT&CK Tactics (Enterprise Matrix),
# representing an explicit, versioned ontology translation designed for multi-stage kill-chain forecasting.

version: "1.0.0"
taxonomy: "MITRE ATT&CK Enterprise Matrix v14.1"
last_updated: "2026-08-27"
curator: "SIH26153 World Model Engineering Team"

# Ordered Kill-Chain Progression
kill_chain_order:
  - id: "TA0043"
    name: "Reconnaissance"
    description: "Adversary is trying to gather information they can use to plan future operations."
    phase_index: 0
    severity: "Low"
  - id: "TA0001"
    name: "Initial Access"
    description: "Adversary is trying to get into your network."
    phase_index: 1
    severity: "Medium"
  - id: "TA0008"
    name: "Lateral Movement"
    description: "Adversary is trying to move through your environment."
    phase_index: 2
    severity: "High"
  - id: "TA0011"
    name: "Command and Control"
    description: "Adversary is trying to communicate with compromised systems to control them."
    phase_index: 3
    severity: "Critical"
  - id: "TA0010"
    name: "Exfiltration"
    description: "Adversary is trying to steal data from your network."
    phase_index: 4
    severity: "Critical"
  - id: "TA0040"
    name: "Impact"
    description: "Adversary is trying to manipulate, interrupt, or destroy your systems and data."
    phase_index: 5
    severity: "Critical"

# Mapping from Dataset Attack Labels to MITRE Tactics and Techniques
mappings:
  # Benign Baseline
  Benign:
    tactic_id: "NONE"
    tactic_name: "Benign"
    technique_id: "T0000"
    technique_name: "Normal Operations"
    kill_chain_stage: 0
    is_malicious: false
    description: "Legitimate corporate and user network traffic."

  # Reconnaissance / Discovery
  PortScan:
    tactic_id: "TA0043"
    tactic_name: "Reconnaissance"
    technique_id: "T1595.001"
    technique_name: "Active Scanning: Scanning IP Blocks / Ports"
    kill_chain_stage: 1
    is_malicious: true
    description: "Probing host ports via TCP SYN / UDP sweeps to discover active services."

  Nmap_Scan:
    tactic_id: "TA0043"
    tactic_name: "Reconnaissance"
    technique_id: "T1595"
    technique_name: "Active Scanning"
    kill_chain_stage: 1
    is_malicious: true
    description: "Automated network scanner probing services, versions, and OS signatures."

  # Initial Access / Credential Access
  FTP-BruteForce:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing"
    kill_chain_stage: 2
    is_malicious: true
    description: "Repeated authentication attempts on FTP (port 21) to gain initial unauthorized access."

  SSH-Bruteforce:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing"
    kill_chain_stage: 2
    is_malicious: true
    description: "High-frequency SSH login requests attempting dictionary password guessing."

  Web Attack – Brute Force:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1110"
    technique_name: "Brute Force"
    kill_chain_stage: 2
    is_malicious: true
    description: "Automated HTTP form credential stuffing against web application logins."

  Web Attack – SQL Injection:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1190"
    technique_name: "Exploit Public-Facing Application"
    kill_chain_stage: 2
    is_malicious: true
    description: "SQL payloads transmitted via HTTP GET/POST parameters to bypass authentication or extract schemas."

  Web Attack – XSS:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1189"
    technique_name: "Drive-by Compromise"
    kill_chain_stage: 2
    is_malicious: true
    description: "Cross-site scripting payload injection aimed at stealing session cookies or pivoting."

  # Lateral Movement / Infiltration
  Infiltration:
    tactic_id: "TA0008"
    tactic_name: "Lateral Movement"
    technique_id: "T1021"
    technique_name: "Remote Services"
    kill_chain_stage: 3
    is_malicious: true
    description: "Pivoting across internal hosts using harvested credentials or local privilege escalation."

  # Command and Control / Exfiltration
  Bot:
    tactic_id: "TA0011"
    tactic_name: "Command and Control"
    technique_id: "T1071.001"
    technique_name: "Application Layer Protocol: Web Protocols"
    kill_chain_stage: 4
    is_malicious: true
    description: "Periodic beaconing and telemetry transmissions between compromised victim and external C2 server."

  C&C-Heartbeat:
    tactic_id: "TA0011"
    tactic_name: "Command and Control"
    technique_id: "T1071"
    technique_name: "Standard Application Layer Protocol"
    kill_chain_stage: 4
    is_malicious: true
    description: "Low-jitter periodic keep-alive beacons maintaining channel synchronization."

  Data_Exfiltration:
    tactic_id: "TA0010"
    tactic_name: "Exfiltration"
    technique_id: "T1048"
    technique_name: "Exfiltration Over Alternative Protocol"
    kill_chain_stage: 5
    is_malicious: true
    description: "High-volume encrypted outbound transfer targeting external unmonitored drop points."

  # Impact / Denial of Service
  DoS attacks-Hulk:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: Direct Network Flood"
    kill_chain_stage: 5
    is_malicious: true
    description: "High-volume HTTP request flood designed to exhaust web server thread pools."

  DoS Hulk:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: Direct Network Flood"
    kill_chain_stage: 5
    is_malicious: true
    description: "High-volume HTTP request flood designed to exhaust web server thread pools."

  DoS GoldenEye:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: GoldenEye HTTP Flood"
    kill_chain_stage: 5
    is_malicious: true
    description: "Multi-threaded HTTP Keep-Alive denial of service attack."

  DoS slowloris:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498"
    technique_name: "Network Denial of Service: Slowloris"
    kill_chain_stage: 5
    is_malicious: true
    description: "Low-bandwidth attack holding connections open with periodic incomplete HTTP headers."

  DoS Slowhttptest:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498"
    technique_name: "Network Denial of Service: SlowHTTPTest"
    kill_chain_stage: 5
    is_malicious: true
    description: "Application-layer denial of service probing connection starvation."

  DDoS:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: Direct Network Flood"
    kill_chain_stage: 5
    is_malicious: true
    description: "Distributed volumetric denial of service targeting exhaustion of network bandwidth."

  Heartbleed:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1190"
    technique_name: "Exploit Public-Facing Application: OpenSSL Heartbleed (CVE-2014-0160)"
    kill_chain_stage: 2
    is_malicious: true
    description: "Buffer over-read in TLS heartbeat extension leaking memory contents."

  FTP-Patator:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing (FTP-Patator)"
    kill_chain_stage: 2
    is_malicious: true
    description: "Multi-threaded modular brute-force authentication against FTP service."

  SSH-Patator:
    tactic_id: "TA0001"
    tactic_name: "Initial Access"
    technique_id: "T1110.001"
    technique_name: "Brute Force: Password Guessing (SSH-Patator)"
    kill_chain_stage: 2
    is_malicious: true
    description: "Multi-threaded modular brute-force authentication against SSH daemon."

  DoS attacks-SlowHTTPTest:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498"
    technique_name: "Network Denial of Service"
    kill_chain_stage: 5
    is_malicious: true
    description: "Slowloris / Slow-POST attack keeping TCP connections open with low bandwidth."

  DDoS attacks-LOIC-HTTP:
    tactic_id: "TA0040"
    tactic_name: "Impact"
    technique_id: "T1498.001"
    technique_name: "Network Denial of Service: Direct Network Flood"
    kill_chain_stage: 5
    is_malicious: true
    description: "Distributed HTTP flood targeting exhaustion of connection backlog queues."

